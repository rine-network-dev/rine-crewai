[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-rine"
version = "0.6.0"
description = "Native CrewAI tools for the Rine network — send, receive, discover, and run E2E-encrypted agent-to-agent conversations and groups from a CrewAI crew"
readme = "README.md"
license = "EUPL-1.2"
requires-python = ">=3.11"
authors = [{ name = "mmmbs", email = "mmmbs@proton.me" }]
keywords = ["rine", "crewai", "agents", "tools", "e2ee", "messaging", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    # Dev/CI consume the LOCAL rine-sdk (editable path dep injected inside the rig,
    # see compose.crewai.yml + Dockerfile) — it carries unreleased fixes. The published
    # floor below is the *intended* runtime pin; the rig installs ./rine-sdk over this
    # entry, so the pin is documented, not active in dev. The `[payments]` extra pulls
    # the wallet-signing deps the rine_pay / rine_fulfill tools need (EIP-3009
    # authorization signing); rine.x402 imports cleanly without it but the pay/fulfill
    # paths raise a friendly error until it is present.
    #
    # PUBLISHED FLOOR 0.11.0, and unlike every floor before it this one is NOT
    # documentation-grade — it is a hard import requirement. These tools import names the
    # SDK first exported in 0.11.0 (`describe_mls_admission`, `own_agents_clause`,
    # `admission_headline`, `VOTE_ELECTORATE_RULE`, `GROUP_ROSTER_LEAD` among others), so
    # against 0.10.0 `import crewai_rine` raises ImportError at module scope. Lower this
    # floor and the package does not fail a call — it fails to load.
    #
    # 0.11.0 also inherits 0.10.0's reason for existing: it is at or above the first rine
    # whose send path fetches the recipient's signing key fresh instead of reading a
    # cached copy, so a peer that rotates its key is sent to under the new key on the very
    # next message rather than up to ten minutes later. A seal is one-shot and reports
    # nothing back, so a message sealed to a stale key is simply unreadable for its
    # recipient — nothing in these tools can detect or retry that.
    "rine[payments]>=0.14.0",
    "crewai>=1.14,<2.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://rine.network"
Documentation = "https://docs.rine.network"
Repository = "https://codeberg.org/rine/rine-crewai"
Issues = "https://codeberg.org/rine/rine-crewai/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.sdist]
# .gitignore does NOT govern sdist contents — this list does. `.e2e.env` (live
# rig credentials) shipped in the 0.1.0 and 0.2.0 sdists because it was only
# gitignored. Keep the env patterns; scripts/scan-artifact-secrets.py is the
# backstop that fails the publish if anything credential-shaped slips back in.
# `.uv-cache/`/`.venv/` are transient uv build artifacts that carry binaries
# (e.g. ruff) whose bytes trip the credential scanner — never ship them.
exclude = ["phases/", "e2e/", "tests/", ".e2e.env", "*.env", ".uv-cache/", ".venv/"]

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_rine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "TCH",
    "D101", "D102", "D103", "D107", "D205", "D400",
]
ignore = ["D100"]

[tool.ruff.lint.per-file-ignores]
# Test classes/methods carry self-documenting `test_<what>_<when>_<expected>`
# names; per-symbol docstrings would be noise. Module + most method
# docstrings are still written by hand, but the rule is not enforced here.
"tests/**" = ["D101", "D102", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# The type gate checks the LOWEST interpreter this package supports, so
# `requires-python = ">=3.11"` above is a claim the gate actually validates. The
# rig's own interpreter is 3.12 (Dockerfile FROM python:3.12-slim); checking at
# 3.11 there is exactly the point — a 3.12-only construct in this package is a
# type error a 3.12-only gate would wave through.
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["crewai_rine"]
mypy_path = "src"

# numpy's installed stub uses PEP 695 `type X = …`, which mypy refuses to parse
# under `python_version = 3.11`. That is a syntax error in a THIRD-PARTY stub,
# and mypy treats it as fatal — "errors prevented further checking" — so the
# whole gate aborts before it reads a line of crewai_rine. Skipping the import
# (numpy is a transitive dependency of crewai's vector-store tree; this package
# never names it) keeps the gate running at the floor it ships.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
