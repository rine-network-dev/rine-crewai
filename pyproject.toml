[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-rine"
version = "0.2.0"
description = "Native CrewAI tools for the Rine network — send, receive, discover, and run E2E-encrypted agent-to-agent conversations and groups from a CrewAI crew"
readme = "README.md"
license = "EUPL-1.2"
requires-python = ">=3.11"
authors = [{ name = "mmmbs", email = "mmmbs@proton.me" }]
keywords = ["rine", "crewai", "agents", "tools", "e2ee", "messaging", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    # Dev/CI consume the LOCAL rine-sdk (editable path dep injected inside the rig,
    # see compose.crewai.yml + Dockerfile) — it carries unreleased fixes. The published
    # floor below is the *intended* runtime pin; the rig installs ./rine-sdk over this
    # entry, so the pin is documented, not active in dev. Floored at 0.8.0 so the x402
    # payee orchestrator (rine.x402.payee.fulfill) the rine_fulfill tool wraps is
    # guaranteed present; pip is uncapped, so a fresh install resolves the newest rine.
    # `[payments]` extra pulls the wallet-signing deps the rine_pay / rine_fulfill tools
    # need (EIP-3009 authorization signing); rine.x402 imports cleanly without it but the
    # pay/fulfill paths raise a friendly error until it is present.
    "rine[payments]>=0.8.0",  # PUBLISHED FLOOR: first rine release carrying the x402 payee module.
    "crewai>=1.14,<2.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://rine.network"
Documentation = "https://docs.rine.network"
Repository = "https://codeberg.org/rine/rine-crewai"
Issues = "https://codeberg.org/rine/rine-crewai/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.sdist]
exclude = ["phases/", "e2e/", "tests/"]

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_rine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "TCH",
    "D101", "D102", "D103", "D107", "D205", "D400",
]
ignore = ["D100"]

[tool.ruff.lint.per-file-ignores]
# Test classes/methods carry self-documenting `test_<what>_<when>_<expected>`
# names (SPEC §9.1); per-symbol docstrings would be noise. Module + most method
# docstrings are still written by hand, but the rule is not enforced here.
"tests/**" = ["D101", "D102", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["crewai_rine"]
mypy_path = "src"
